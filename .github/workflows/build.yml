
name: Build XCloud Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q XCloudPro-by-Flaxxy-Expanded-Starter.zip -d xcloud-project

      - name: Fix AlertDialog import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("xcloud-project")
          files = list(root.rglob("MainActivity.kt"))

          if not files:
              raise SystemExit("ERROR: MainActivity.kt not found")

          for p in files:
              s = p.read_text(encoding="utf-8")

              if not re.search(r'\bAlertDialog\b', s):
                  print(f"No AlertDialog usage in {p}")
                  continue

              # Remove conflicting AlertDialog imports, if present.
              s = re.sub(
                  r'(?m)^import\s+(?:android\.app|androidx\.appcompat\.app)\.AlertDialog\s*\n',
                  '',
                  s
              )

              # Insert the native Android AlertDialog import.
              match = re.search(r'(?m)^package\s+[^;\n]+\s*\n', s)
              if not match:
                  raise SystemExit(f"ERROR: package declaration missing in {p}")

              s = (
                  s[:match.end()]
                  + "\nimport android.app.AlertDialog\n"
                  + s[match.end():]
              )

              p.write_text(s, encoding="utf-8")
              print(f"Added AlertDialog import to {p}")
          PY

      - name: Build debug APK
        run: gradle --no-daemon -p xcloud-project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XCloud-Pro-APK
          path: xcloud-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
