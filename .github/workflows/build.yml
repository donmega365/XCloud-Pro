
name: Build XCloud Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q XCloudPro-by-Flaxxy-Expanded-Starter.zip -d xcloud-project

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("xcloud-project/app/build.gradle")
          if not p.exists():
              raise SystemExit(f"Gradle file not found: {p}")

          s = p.read_text()
          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")

          s = re.sub(
              r"(sourceCompatibility\s*[= ]\s*)['\"]?1\.8['\"]?",
              r"\1JavaVersion.VERSION_17", s
          )
          s = re.sub(
              r"(targetCompatibility\s*[= ]\s*)['\"]?1\.8['\"]?",
              r"\1JavaVersion.VERSION_17", s
          )

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  "android {\n"
                  "    compileOptions {\n"
                  "        sourceCompatibility JavaVersion.VERSION_17\n"
                  "        targetCompatibility JavaVersion.VERSION_17\n"
                  "    }\n",
                  1
              )

          if "kotlinOptions" not in s:
              s = s.replace(
                  "android {",
                  "android {\n"
                  "    kotlinOptions { jvmTarget = '17' }\n",
                  1
              )

          p.write_text(s)
          print("Configured Java/Kotlin target 17")
          PY

      - name: Build APK
        run: gradle --no-daemon -p xcloud-project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XCloud-Pro-APK
          path: xcloud-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
