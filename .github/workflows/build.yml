
name: Build XCloud Pro APK

'on':
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Extract Android project
    run: |
      unzip -q XCloudPro-by-Flaxxy-Expanded-Starter.zip -d xcloud-project

  - name: Set Java and Kotlin targets
    run: |
      cat > xcloud-project/app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
          id 'org.jetbrains.kotlin.android'
      }

      android {
          namespace 'com.example.xcloudpro'
          compileSdk 35

          defaultConfig {
              applicationId 'com.example.xcloudpro'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '0.1.0'
          }

          compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = '17'
          }
      }
      EOF

  - name: Build debug APK
    run: gradle -p xcloud-project assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: XCloud-Pro-APK
      path: xcloud-project/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
